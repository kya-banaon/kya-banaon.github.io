<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFB74D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFB74D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#FFF8DC"/>
  
  <!-- Steam lines -->
  <path d="M 180 200 Q 150 140 180 80 T 180 40" fill="none" stroke="url(#steamGrad)" stroke-width="24" stroke-linecap="round"/>
  <path d="M 256 220 Q 226 160 256 100 T 256 60" fill="none" stroke="url(#steamGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M 332 200 Q 302 140 332 80 T 332 40" fill="none" stroke="url(#steamGrad)" stroke-width="24" stroke-linecap="round"/>

  <!-- Bowl Base -->
  <path d="M 80 256 C 80 390 140 430 256 430 C 372 430 432 390 432 256 Z" fill="url(#bowlGrad)"/>
  
  <!-- Bowl Lip -->
  <ellipse cx="256" cy="256" rx="176" ry="40" fill="#FFCC80"/>
  
  <!-- Food (Curry/Dal) inside -->
  <ellipse cx="256" cy="256" rx="156" ry="32" fill="#D84315"/>
  <ellipse cx="256" cy="256" rx="140" ry="24" fill="#BF360C"/>
  
  <!-- Mint/Coriander Garnish -->
  <path d="M 230 250 Q 220 230 240 240 Q 250 250 230 250 Z" fill="#4CAF50"/>
  <path d="M 240 240 Q 250 220 260 240 Q 250 250 240 240 Z" fill="#81C784"/>
  <path d="M 260 240 Q 280 230 270 250 Q 250 260 260 240 Z" fill="#388E3C"/>
</svg>